<script>
const topics = [
  {
    id: 1, group: 'basics', groupLabel: 'PAAYA (Basics)', labelClass: 'label-basics',
    title: 'Boilerplate Code',
    subtitle: '#include, namespace, main()',
    def: 'Every C++ program is a structured contract: you declare libraries, scope resolution, and a mandatory entry point. Without <code style="color:#a78bfa;font-family:JetBrains Mono,monospace">int main()</code>, the compiler has no start address — the program doesn\'t exist.',
    rules: [
      { icon: '⚡', text: '<strong>#include &lt;iostream&gt;</strong> — plugs in cin/cout. Without it, you\'re speaking to a deaf compiler.' },
      { icon: '⚡', text: '<strong>using namespace std;</strong> — lets you write <code style="color:#a78bfa">cout</code> instead of <code style="color:#a78bfa">std::cout</code> every single time.' },
      { icon: '⚡', text: '<strong>int main()</strong> returns an integer. <code style="color:#a78bfa">return 0</code> = success. OS reads this.' },
      { icon: '🔴', text: '<strong>Semicolons are MANDATORY</strong> after every statement. Python doesn\'t need them. C++ will refuse to compile without them.' },
    ],
    code: `<span class="kw">#include</span> <span class="str">&lt;iostream&gt;</span>
<span class="kw">using namespace</span> std;

<span class="tp">int</span> <span class="fn">main</span>() {
    cout <span class="op">&lt;&lt;</span> <span class="str">"Hello, IIT Delhi!"</span> <span class="op">&lt;&lt;</span> endl;
    <span class="kw">return</span> <span class="num">0</span>;  <span class="cmt">// OS reads this: 0 = OK</span>
}`,
    pyVsCpp: {
      py: `<span class="cmt"># Python: just write it</span>
<span class="kw">print</span>(<span class="str">"Hello, IIT Delhi!"</span>)
<span class="cmt"># No headers, no main, no semicolons</span>`,
      cpp: `<span class="cmt">// C++: structured contract</span>
<span class="kw">#include</span> <span class="str">&lt;iostream&gt;</span>
<span class="kw">using namespace</span> std;
<span class="tp">int</span> <span class="fn">main</span>() {
    cout <span class="op">&lt;&lt;</span> <span class="str">"Hello, IIT Delhi!"</span>;
    <span class="kw">return</span> <span class="num">0</span>;
}`
    }
  },
  {
    id: 2, group: 'basics', groupLabel: 'PAAYA (Basics)', labelClass: 'label-basics',
    title: 'Variables & Data Types',
    subtitle: 'int, double, char, string, bool',
    def: 'C++ is statically typed — every variable must declare its type at compile time. The compiler allocates exact memory based on the type, unlike Python\'s dynamic objects.',
    rules: [
      { icon: '📦', text: '<strong>int</strong> = 4 bytes (±2.1 billion). For loop counters, indices, whole numbers.' },
      { icon: '📦', text: '<strong>double</strong> = 8 bytes. For decimals. Prefer over <code style="color:#a78bfa">float</code> (4 bytes, less precise).' },
      { icon: '📦', text: '<strong>char</strong> = 1 byte. Always use <strong>single quotes</strong>: <code style="color:#a78bfa">\'A\'</code>. Double quotes = string literal, NOT char.' },
      { icon: '📦', text: '<strong>string</strong> = variable bytes. Always use <strong>double quotes</strong>: <code style="color:#a78bfa">"hello"</code>. Needs <code style="color:#a78bfa">#include &lt;string&gt;</code> (or iostream covers it).' },
      { icon: '📦', text: '<strong>bool</strong> = 1 byte. Values: <code style="color:#a78bfa">true</code> / <code style="color:#a78bfa">false</code> (lowercase). Prints as 1 or 0.' },
    ],
    code: `<span class="tp">int</span> age <span class="op">=</span> <span class="num">19</span>;           <span class="cmt">// 4 bytes</span>
<span class="tp">double</span> cgpa <span class="op">=</span> <span class="num">9.81</span>;       <span class="cmt">// 8 bytes, use for decimals</span>
<span class="tp">char</span> grade <span class="op">=</span> <span class="str">'A'</span>;         <span class="cmt">// single quotes ONLY</span>
<span class="tp">string</span> name <span class="op">=</span> <span class="str">"Arjun"</span>;    <span class="cmt">// double quotes ONLY</span>
<span class="tp">bool</span> passed <span class="op">=</span> <span class="kw">true</span>;       <span class="cmt">// prints as 1</span>

<span class="cmt">// sizeof() — your memory inspector</span>
cout <span class="op">&lt;&lt;</span> <span class="kw">sizeof</span>(age) <span class="op">&lt;&lt;</span> endl;  <span class="cmt">// 4</span>`,
    pyVsCpp: {
      py: `<span class="cmt"># Python: dynamic typing</span>
x <span class="op">=</span> <span class="num">10</span>
x <span class="op">=</span> <span class="str">"hello"</span>  <span class="cmt"># valid!</span>
x <span class="op">=</span> <span class="num">3.14</span>    <span class="cmt"># still valid!</span>`,
      cpp: `<span class="cmt">// C++: static typing</span>
<span class="tp">int</span> x <span class="op">=</span> <span class="num">10</span>;
<span class="cmt">// x = "hello"; // COMPILE ERROR</span>
<span class="cmt">// Type is locked at declaration</span>`
    }
  },
  {
    id: 3, group: 'basics', groupLabel: 'PAAYA (Basics)', labelClass: 'label-basics',
    title: 'User Input / Output',
    subtitle: 'cout <<, cin >>, endl',
    def: '<code style="color:#a78bfa">cout</code> pushes data to stdout via the insertion operator <code style="color:#a78bfa">&lt;&lt;</code>. <code style="color:#a78bfa">cin</code> pulls data from stdin via the extraction operator <code style="color:#a78bfa">&gt;&gt;</code>. Both are stream objects, not functions.',
    rules: [
      { icon: '→', text: '<strong>cout &lt;&lt;</strong> — insertion: data flows into the output stream. Think of &lt;&lt; as an arrow pointing right.' },
      { icon: '←', text: '<strong>cin &gt;&gt;</strong> — extraction: data flows out of input into your variable. Think of &gt;&gt; as pulling from terminal.' },
      { icon: '⚡', text: '<strong>endl</strong> flushes the buffer AND adds newline. <code style="color:#a78bfa">"\\n"</code> is faster (no flush). Prefer <code style="color:#a78bfa">\\n</code> in competitive programming.' },
      { icon: '⚠️', text: '<strong>cin stops at whitespace.</strong> For full-line input, use <code style="color:#a78bfa">getline(cin, str)</code> instead.' },
    ],
    code: `<span class="kw">#include</span> <span class="str">&lt;iostream&gt;</span>
<span class="kw">using namespace</span> std;

<span class="tp">int</span> <span class="fn">main</span>() {
    <span class="tp">int</span> n;
    <span class="tp">string</span> name;

    cout <span class="op">&lt;&lt;</span> <span class="str">"Enter a number: "</span>;
    cin <span class="op">&gt;&gt;</span> n;                   <span class="cmt">// reads until whitespace</span>

    cin.<span class="fn">ignore</span>();               <span class="cmt">// flush leftover newline</span>
    cout <span class="op">&lt;&lt;</span> <span class="str">"Enter your name: "</span>;
    <span class="fn">getline</span>(cin, name);         <span class="cmt">// reads FULL line with spaces</span>

    cout <span class="op">&lt;&lt;</span> name <span class="op">&lt;&lt;</span> <span class="str">", you entered: "</span> <span class="op">&lt;&lt;</span> n <span class="op">&lt;&lt;</span> <span class="str">"\\n"</span>;
    <span class="kw">return</span> <span class="num">0</span>;
}`,
    pyVsCpp: {
      py: `<span class="cmt"># Python</span>
name <span class="op">=</span> <span class="fn">input</span>(<span class="str">"Name: "</span>)
n <span class="op">=</span> <span class="tp">int</span>(<span class="fn">input</span>(<span class="str">"Num: "</span>))
<span class="kw">print</span>(name, n)`,
      cpp: `<span class="cmt">// C++</span>
<span class="tp">string</span> name; <span class="tp">int</span> n;
<span class="fn">getline</span>(cin, name);
cin <span class="op">&gt;&gt;</span> n;
cout <span class="op">&lt;&lt;</span> name <span class="op">&lt;&lt;</span> n;`
    }
  },
  {
    id: 4, group: 'basics', groupLabel: 'PAAYA (Basics)', labelClass: 'label-basics',
    title: 'Conditionals',
    subtitle: 'if, else if, else, &&, ||',
    def: 'C++ conditionals evaluate boolean expressions and branch execution. The syntax is structurally identical to most C-family languages — braces define scope, and conditions live in parentheses.',
    rules: [
      { icon: '⚡', text: '<strong>else if</strong> — NOT <code style="color:#a78bfa">elif</code>. Python habit will bite you here.' },
      { icon: '⚡', text: '<strong>&&</strong> = AND, <strong>||</strong> = OR, <strong>!</strong> = NOT. Operators, not keywords like Python\'s <code style="color:#a78bfa">and/or/not</code>.' },
      { icon: '⚡', text: '<strong>Braces are optional</strong> for single statements but ALWAYS use them. Missing braces = subtle bugs.' },
      { icon: '⚡', text: '<strong>Ternary shortcut:</strong> <code style="color:#a78bfa">condition ? val_if_true : val_if_false</code> — use for simple assignments.' },
    ],
    code: `<span class="tp">int</span> marks <span class="op">=</span> <span class="num">85</span>;

<span class="kw">if</span> (marks <span class="op">&gt;=</span> <span class="num">90</span> <span class="op">&&</span> marks <span class="op">&lt;=</span> <span class="num">100</span>) {
    cout <span class="op">&lt;&lt;</span> <span class="str">"O Grade\\n"</span>;
} <span class="kw">else if</span> (marks <span class="op">&gt;=</span> <span class="num">75</span>) {  <span class="cmt">// NOT elif!</span>
    cout <span class="op">&lt;&lt;</span> <span class="str">"A Grade\\n"</span>;
} <span class="kw">else if</span> (marks <span class="op">&gt;=</span> <span class="num">50</span> <span class="op">||</span> marks <span class="op">==</span> <span class="num">49</span>) {
    cout <span class="op">&lt;&lt;</span> <span class="str">"Pass\\n"</span>;
} <span class="kw">else</span> {
    cout <span class="op">&lt;&lt;</span> <span class="str">"Fail\\n"</span>;
}

<span class="cmt">// Ternary — clean one-liner</span>
<span class="tp">string</span> result <span class="op">=</span> (marks <span class="op">&gt;=</span> <span class="num">50</span>) ? <span class="str">"Pass"</span> : <span class="str">"Fail"</span>;`,
    pyVsCpp: {
      py: `<span class="kw">if</span> x <span class="op">==</span> <span class="num">1</span>:
    <span class="kw">print</span>(<span class="str">"one"</span>)
<span class="kw">elif</span> x <span class="op">==</span> <span class="num">2</span>:
    <span class="kw">print</span>(<span class="str">"two"</span>)
<span class="kw">else</span>:
    <span class="kw">print</span>(<span class="str">"other"</span>)`,
      cpp: `<span class="kw">if</span> (x <span class="op">==</span> <span class="num">1</span>) {
    cout <span class="op">&lt;&lt;</span> <span class="str">"one"</span>;
} <span class="kw">else if</span> (x <span class="op">==</span> <span class="num">2</span>) {
    cout <span class="op">&lt;&lt;</span> <span class="str">"two"</span>;
} <span class="kw">else</span> { cout <span class="op">&lt;&lt;</span> <span class="str">"other"</span>; }`
    }
  },
  {
    id: 5, group: 'basics', groupLabel: 'PAAYA (Basics)', labelClass: 'label-basics',
    title: 'For Loops',
    subtitle: 'init; condition; increment',
    def: 'The C++ for loop packs three control expressions — initialization, condition, and update — into a single header line. Execution: init once → check condition → body → update → repeat.',
    rules: [
      { icon: '⚡', text: '<strong>Syntax: for (init; condition; update)</strong> — all three in the header, separated by semicolons.' },
      { icon: '⚡', text: '<strong>i++</strong> = post-increment (use after), <strong>++i</strong> = pre-increment. In simple loops, same result. <code style="color:#a78bfa">i++</code> is convention.' },
      { icon: '⚡', text: '<strong>0-based indexing always.</strong> Loop from 0 to n-1: <code style="color:#a78bfa">for (int i = 0; i &lt; n; i++)</code>' },
      { icon: '⚡', text: '<strong>Range-based for (C++11):</strong> <code style="color:#a78bfa">for (auto x : arr)</code> — clean, like Python\'s for-in. Use when you don\'t need the index.' },
    ],

    <span class="kw">print</span>(k, v)`,

    def: 'Big-O notation describes how an algorithm\'s resource usage (time or memory) scales with input size N. It\'s the language judges (and interviewers) use to evaluate your solution before even running it.',
    rules: [
      { icon: '⚡', text: '<strong>O(1)</strong> — constant. No matter how large N is, same time. Array access, hash map lookup.' },
      { icon: '⚡', text: '<strong>O(log N)</strong> — eliminates half the input each step. Binary search, balanced BST ops.' },
      { icon: '⚡', text: '<strong>O(N)</strong> — linear scan. One loop over N elements. Single traversal, linear search.' },
      { icon: '⚡', text: '<strong>O(N log N)</strong> — efficient sorts. Merge sort, heap sort, <code style="color:#a78bfa">std::sort()</code>.' },

let expanded = new Set();
let filter = 'all';

function buildProgress() {
  const bar = document.getElementById('progBar');
  bar.innerHTML = topics.map((t, i) => 
    `<div class="progress-seg ${expanded.has(t.id) ? 'done' : ''}" 
          data-id="${t.id}" 
          onclick="jumpTo(${t.id})"
          title="Topic ${t.id}: ${t.title}"></div>`
  ).join('');
}

function updateScore() {
  const score = document.getElementById('scoreVal');
  const msg = document.getElementById('scoreMsg');
  const count = expanded.size;
  score.textContent = `${count} / 15`;
  const msgs = ['— Start clicking to track progress', '— Getting warmed up!', '— Keep going, you\'re doing great!', 
    '— Halfway there!', '— Almost done!', '— COMPLETE! Ready for DSA tomorrow 🎯'];
  const idx = count === 0 ? 0 : count <= 3 ? 1 : count <= 7 ? 2 : count <= 10 ? 3 : count <= 13 ? 4 : 5;
  msg.textContent = msgs[idx];
}

function renderTopics() {
  const container = document.getElementById('topicsContainer');
  const filtered = filter === 'all' ? topics : topics.filter(t => t.group === filter);
  
  let lastGroup = '';
  let html = '';
  
  filtered.forEach(t => {
    if (t.groupLabel !== lastGroup) {
      lastGroup = t.groupLabel;
      html += `<div class="section-label ${t.labelClass}">${t.groupLabel}</div>`;
    }
    
    const isOpen = expanded.has(t.id);
    
    let pyVsCppHtml = '';
    if (t.pyVsCpp) {
      pyVsCppHtml = `
        <div class="py-cpp">
          <div class="lang-block py-block">
            <span class="lang-label py-label">Python</span>
            <pre>${t.pyVsCpp.py}</pre>
          </div>
          <div class="lang-block cpp-block">
            <span class="lang-label cpp-label">C++</span>
            <pre>${t.pyVsCpp.cpp}</pre>
          </div>
        </div>`;
    }

    let complexityHtml = '';
    if (t.complexityCards) {
      complexityHtml = `
        <div class="complexity-grid">
          <div class="cx-card cx-green">
            <span class="cx-o">O(1)</span>
            <span class="cx-name">Constant</span>
            <span class="cx-eg">Array access</span>
          </div>
          <div class="cx-card cx-blue">
            <span class="cx-o">O(N)</span>
            <span class="cx-name">Linear</span>
            <span class="cx-eg">Single loop</span>
          </div>
          <div class="cx-card cx-amber">
            <span class="cx-o">O(N log N)</span>
            <span class="cx-name">Log-linear</span>
            <span class="cx-eg">std::sort</span>
          </div>
          <div class="cx-card cx-red">
            <span class="cx-o">O(N²)</span>
            <span class="cx-name">Quadratic</span>
            <span class="cx-eg">Nested loops</span>
          </div>
        </div>`;
    }
    
    html += `
      <div class="topic-card ${isOpen ? 'expanded' : ''}" id="card-${t.id}">
        <div class="topic-header" onclick="toggleTopic(${t.id})">
          <div class="topic-num">T${String(t.id).padStart(2,'0')}</div>
          <div style="flex:1">
            <div class="topic-title">${t.title}</div>
            <div class="topic-subtitle">${t.subtitle}</div>
          </div>
          <div class="chevron">⌄</div>
        </div>
        <div class="topic-body ${isOpen ? 'open' : ''}">
          <div class="def-block">${t.def}</div>
          <div class="rules-grid">
            ${t.rules.map(r => `<div class="rule-item"><span class="rule-icon">${r.icon}</span><span>${r.text}</span></div>`).join('')}
          </div>
          ${complexityHtml}
          <div class="code-wrap">
            <div class="code-label">
              <span>C++ · Production Code</span>
              <button class="copy-btn" onclick="copyCode(${t.id}, event)">copy</button>
            </div>
            <pre id="code-${t.id}">${t.code}</pre>
          </div>
          ${pyVsCppHtml}
        </div>
      </div>`;
  });
  
  container.innerHTML = html;
}

function toggleTopic(id) {
  if (expanded.has(id)) {
    expanded.delete(id);
  } else {
    expanded.add(id);
  }
  renderTopics();
  buildProgress();
  updateScore();
}

function jumpTo(id) {
  if (!expanded.has(id)) {
    expanded.add(id);
    renderTopics();
    buildProgress();
    updateScore();
  }
  setTimeout(() => {
    const el = document.getElementById(`card-${id}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

function filterTopics(f, btn) {
  filter = f;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-filter'));
  btn.classList.add('active-filter');
  renderTopics();
}

function expandAll() {
  topics.forEach(t => expanded.add(t.id));
  renderTopics();
  buildProgress();
  updateScore();
}

function collapseAll() {
  expanded.clear();
  renderTopics();
  buildProgress();
  updateScore();
}

function copyCode(id, e) {
  e.stopPropagation();
  const pre = document.getElementById(`code-${id}`);
  const text = pre ? pre.innerText : '';
  navigator.clipboard.writeText(text).then(() => {
    const btn = e.target;
    btn.textContent = 'copied!';
    setTimeout(() => btn.textContent = 'copy', 1500);
  });
}

renderTopics();
buildProgress();
updateScore();
</script>
