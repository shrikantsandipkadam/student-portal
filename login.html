<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IIT Student Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages/login.css">
</head>
<body class="login-page">
    <button class="theme-toggle-btn" onclick="handleLoginThemeButtonClick(event)" title="Switch colour theme"><span data-theme="red">R</span><span data-theme="green">G</span><span data-theme="blue">B</span><span data-theme="light">W</span><span data-theme="dark">D</span></button>

    <main class="login-shell">
        <section class="login-brand">
            <div class="brand-logo">
                <div class="logo-mark">IITD</div>
            </div>
            <p class="login-kicker">IIT Delhi 2026</p>
            <h1>Welcome Back</h1>
            <p class="login-subtitle">Sign in to access your student portal with grades, planning, resources, and campus essentials all in one place.</p>
            
            <div class="brand-features">
                <div class="feature-item">
                    <span class="feature-icon">📊</span>
                    <span>CGPA & Grades</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">📅</span>
                    <span>Timetable & Planner</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">🍽️</span>
                    <span>Mess Menu</span>
                </div>
                <div class="feature-item">
                    <span class="feature-icon">📚</span>
                    <span>Resources</span>
                </div>
            </div>
        </section>

        <section class="login-card">
            <h2>Student Login</h2>

            <form onsubmit="login(event)">
                <label for="username">Username or Student ID</label>
                <input id="username" type="text" placeholder="Enter your username" required autofocus>

                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Enter your password" required>

                <button type="submit" class="login-btn">Sign In</button>

                <p id="msg" class="login-msg"></p>
            </form>

            <div class="login-footer">
                <p class="login-note">Demo: Use any username and password.</p>
                <p class="login-contact">Need help? Contact 9503159566</p>
            </div>
        </section>
    </main>

    <script>
        const loginThemes = ["red", "green", "blue", "light", "dark"];

        function getLoginTheme() {
            const storedTheme = localStorage.getItem("portalTheme") || "red";
            return loginThemes.includes(storedTheme) ? storedTheme : "red";
        }

        function applyLoginTheme(theme) {
            const safeTheme = loginThemes.includes(theme) ? theme : "red";
            document.body.classList.remove("dark", "theme-light", "theme-red", "theme-green", "theme-blue", "theme-dark");
            document.body.classList.add("theme-" + safeTheme);
            localStorage.setItem("portalTheme", safeTheme);
            updateThemeToggle();
        }

        function toggleLoginTheme() {
            const currentTheme = getLoginTheme();
            const nextTheme = loginThemes[(loginThemes.indexOf(currentTheme) + 1) % loginThemes.length];
            applyLoginTheme(nextTheme);
        }

        function handleLoginThemeButtonClick(event) {
            const targetTheme = event.target && event.target.dataset ? event.target.dataset.theme : "";
            if (loginThemes.includes(targetTheme)) {
                applyLoginTheme(targetTheme);
                return;
            }

            toggleLoginTheme();
        }

        function updateThemeToggle() {
            const btn = document.querySelector('.theme-toggle-btn');
            const currentTheme = getLoginTheme();
            const nextTheme = loginThemes[(loginThemes.indexOf(currentTheme) + 1) % loginThemes.length];
            const label = nextTheme.charAt(0).toUpperCase() + nextTheme.slice(1);
            btn.innerHTML = '<span data-theme="red">R</span><span data-theme="green">G</span><span data-theme="blue">B</span><span data-theme="light">W</span><span data-theme="dark">D</span>';
            btn.title = 'Switch to ' + label.toLowerCase() + ' theme';
        }

        function loadLoginTheme() {
            applyLoginTheme(getLoginTheme());
        }

        window.addEventListener('load', loadLoginTheme);
    </script>

    <script src="js/auth.js"></script>
</body>
</html>
